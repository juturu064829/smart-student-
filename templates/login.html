<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
        }
    </style>
</head>
<body>
    <div class="glass-panel login-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-20 rounded-circle mb-3" style="width: 70px; height: 70px;">
                <i class="fa-solid fa-graduation-cap fa-2x text-primary"></i>
            </div>
            <h3 class="fw-bold brand-font text-light">Smart Student Management System</h3>
            <p class="text-muted small">Centralized College Administration & Analytics Portal</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show mb-4" role="alert">
                        <small>{{ message }}</small>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small fw-semibold">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username_input" name="username" class="form-control" placeholder="admin / faculty1 / student1" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-muted small fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password_input" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-4">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
            </button>

            <!-- Quick Demo Accounts -->
            <div class="border-top border-secondary pt-3">
                <p class="text-center text-muted small mb-2">Quick Demo Account Switcher:</p>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-info flex-fill" onclick="fillCreds('admin', 'admin123')">
                        <i class="fa-solid fa-user-shield me-1"></i> Admin
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-warning flex-fill" onclick="fillCreds('faculty1', 'faculty123')">
                        <i class="fa-solid fa-chalkboard-user me-1"></i> Faculty
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-success flex-fill" onclick="fillCreds('student1', 'student123')">
                        <i class="fa-solid fa-user-graduate me-1"></i> Student
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        function fillCreds(user, pass) {
            document.getElementById('username_input').value = user;
            document.getElementById('password_input').value = pass;
        }
    </script>
</body>
</html>
